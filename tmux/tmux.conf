# Prefix: C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits open in the current pane's directory
bind -n C-b split-window -h -c "#{pane_current_path}"
bind -n C-f split-window -v -c "#{pane_current_path}"
bind v split-window -h -l 40% -c "#{pane_current_path}"
bind h split-window -v -l 25% -c "#{pane_current_path}"

# Keep the server running when the last session closes
set -s exit-empty off

#################################################################################################
# BEHAVIOUR

setw -g mode-keys vi
set -g mouse on
set -g renumber-windows on
set -s escape-time 10
set -g default-command zsh
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on

# tmux-256color where its terminfo exists (older macOS lacks it)
if 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal tmux-256color' \
  'set -g default-terminal screen-256color'
# 24-bit colour; over mosh this needs mosh >= 1.4 on both ends
set -as terminal-features ',xterm-256color:RGB'

# Clipboard via OSC 52, so copies reach the local clipboard over ssh/mosh.
# mosh only forwards "52;c;". tmux sends "52;;" for its own copies, so force "c".
# %p1%.0s swallows tmux's selection argument; newer ncurses drops an Ms that skips %p1.
set -g set-clipboard on
set -as terminal-overrides ',xterm*:Ms=\E]52;c%p1%.0s;%p2%s\7'

# Vim-style selection in copy mode; y and mouse selection copy via OSC 52
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

#################################################################################################
# OTHER SHORTCUTS

bind r source-file ~/.tmux.conf \; display ".tmux.conf reloaded"
bind a last-window
bind C-p previous-window
bind C-n next-window
bind G new
bind s set-window-option synchronize-panes

#################################################################################################
# LOOK

set -g pane-border-style fg=colour0
set -g pane-active-border-style fg=colour26

# A floating scratch shell in the current directory
bind P display-popup -E -d "#{pane_current_path}"

# Session pill turns red while the prefix is active
%hidden PILL='#{?client_prefix,colour9,colour18}'

set -g status-style bg=default
set -g status-left-length 200
set -g status-right-length 120
set -g status-left "#[fg=colour15,bg=$PILL] #S #[default] "
set -g window-status-current-format "#[fg=colour15,bg=colour33] #I:#W#{?window_zoomed_flag,[Z],} "
set -g window-status-format "#[fg=colour15,bg=colour244] #I:#W#{?window_zoomed_flag,[Z],} "
set -g status-right "#[fg=colour15,bg=colour18] #{user}@#h #[default] #[fg=colour15,bg=colour18] %H:%M %a %d/%m/%y #[default]#{?pane_synchronized, #[fg=colour15]#[bg=colour9] S #[default],}"

#################################################################################################
# PLUGINS

# vim-tmux-navigator: C-h/j/k/l/\ pass through to (n)vim, fzf and emacs, otherwise switch panes
set -g @vim_navigator_pattern '((\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?|emacs.*)'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Keep at the very bottom
run '~/dotfiles/tmux/tpm/tpm'
